name: Test and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Every job can read the code and nothing more. Only the deploy job, which runs on main
# after both check jobs pass, gets the two permissions that publish the site.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # A newer push may cancel an older pull request run, but a run on main always finishes,
  # so a deploy is never cut off halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests, the hand-scored cases and coverage floors
        run: npm run test:coverage
      - name: The hand-scored cases file is up to date
        run: npm run gen:cases && git diff --exit-code docs/test-cases.json
      - name: The agreement script's own check
        run: python3 docs/agreement/analyze.py --selftest
      - name: Known vulnerabilities in the app's own dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.event_name != 'pull_request'
        with:
          path: dist

  browser:
    name: Browser checks and axe (4 display modes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Chromium and the system libraries it needs
        run: npx playwright install --with-deps chromium
      - name: Every check in e2e/ plus the axe audit, against the production build
        run: npm run checks
      - name: Report on the run page
        if: always()
        run: cat .checks/report.md >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
