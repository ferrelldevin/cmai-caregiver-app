# Dependabot opens one grouped pull request a month per ecosystem for minor and patch updates.
# A major version arrives as its own pull request, so one breaking upgrade cannot fail the batch. Security fixes still arrive as soon as they are published, once
# "Dependabot security updates" is on in the repo's Code security settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    # Recharts is removed by plan step 4.4, so a major upgrade of it is wasted work until then.
    ignore:
      - dependency-name: "recharts"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript below 6.1 only (checked 2026-11-10), so TypeScript 7 would break lint.
      # Remove this when typescript-eslint's peer range allows it (plan step 2.3, item 3).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
