# Dependabot opens at most one grouped pull request a month per ecosystem, so updates arrive
# in one reviewable batch. Security fixes still arrive as soon as they are published, once
# "Dependabot security updates" is on in the repo's Code security settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
